name: Deploy trailer to GitHub Pages

on:
  push:
    branches: [claude/dreamy-maxwell-12vrnv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish the site to the gh-pages branch. Creating that branch
      # auto-enables GitHub Pages, so no repo-settings access is needed
      # (the GITHUB_TOKEN cannot enable Pages via the API).
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push -f origin gh-pages
