<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE DEATH OF MAO — Official Teaser Trailer</title>
  <meta name="description" content="A satirical 3D animated teaser trailer in the spirit of The Death of Stalin. A comedy of succession." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <!-- cinematic dressing -->
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="bar-top" class="letterbox"></div>
    <div id="bar-bottom" class="letterbox"></div>

    <!-- timeline overlay cards are injected here -->
    <div id="cards"></div>

    <!-- progress -->
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="timecode">00:00 / 03:00</div>

    <!-- landing / poster overlay -->
    <div id="poster">
      <div class="poster-inner">
        <div class="poster-kicker">People&rsquo;s Pictures presents &mdash; in the spirit of <em>The Death of Stalin</em></div>
        <h1 class="poster-title"><span>THE</span><span>DEATH</span><span>OF&nbsp;MAO</span></h1>
        <div class="poster-tag">A&nbsp;COMEDY&nbsp;OF&nbsp;SUCCESSION</div>
        <button id="play">&#9654;&nbsp;&nbsp;PLAY TRAILER</button>
        <div class="poster-foot">3-minute 3D animated teaser &middot; sound on &middot; satire, obviously</div>
      </div>
    </div>

    <!-- end card -->
    <div id="endcard">
      <div class="poster-inner">
        <h1 class="poster-title small"><span>THE</span><span>DEATH</span><span>OF&nbsp;MAO</span></h1>
        <button id="replay">&#8635;&nbsp;&nbsp;WATCH IT AGAIN, COMRADE</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
