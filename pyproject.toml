[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xi-succession"
version = "0.1.0"
description = "Structured-analytic-techniques workbench for Xi succession scenario analysis"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
xi-succession = "xi_succession.cli:main"

[tool.setuptools]
packages = ["xi_succession"]
