<!doctype html><html><head><meta charset="utf-8">
<title>Civ Arena — history</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px} .sub{color:var(--dim);margin-top:4px}
  .list{padding:16px 24px;display:flex;flex-direction:column;gap:10px;max-width:900px}
  a.row{display:block;text-decoration:none;color:var(--fg);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s}
  a.row:hover{border-color:#8b949e}
  .when{color:var(--dim);font-size:12px}
  .head{font-size:15px;font-weight:600;margin:2px 0}
  .models{color:var(--dim);font-size:12px}
  .dim{color:var(--dim)} code{background:#21262d;padding:1px 6px;border-radius:5px}
</style></head><body>
<header><h1>🗂️ Civ Arena — history</h1>
  <div class="sub">past matches &amp; tournaments, newest first · click to re-open</div></header>
<div class="list" id="list"></div>
<script>
function models(it){
  if(!it.models) return '';
  if(Array.isArray(it.models)) return it.models.join(' · ');
  return Object.entries(it.models).map(([c,m])=>`${c}=${m}`).join(' · ');
}
fetch('runs/manifest.json?_='+Date.now()).then(r=>r.ok?r.json():[]).then(items=>{
  const el=document.getElementById('list');
  if(!items || !items.length){
    el.innerHTML='<p class="dim">No games yet. Run a match or tournament, then refresh.</p>';return;}
  el.innerHTML=items.map(it=>{
    const head = it.kind==='tournament'
      ? `🏟️ tournament — top <b>${it.top||'?'}</b> · ${it.matches||'?'} matches`
      : `⚔️ match — winner <b>${it.winner||'?'}</b> · ${it.rounds||'?'} rounds`;
    return `<a class="row" href="runs/${it.id}.html">
      <div class="when">${it.time} · ${it.mode||it.kind}</div>
      <div class="head">${head}</div><div class="models">${models(it)}</div></a>`;
  }).join('');
}).catch(()=>{document.getElementById('list').innerHTML=
  '<p class="dim">Serve this directory over http (<code>python -m http.server</code>) to view history — '+
  'browser <code>fetch</code> is blocked on <code>file://</code>.</p>';});
</script></body></html>
