<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Paramount Leader — The Xi Jinping Career Simulator">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="80%">
      <stop offset="0%" stop-color="#ffd75e" stop-opacity=".30"/>
      <stop offset="60%" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c0d13"/>
      <stop offset="55%" stop-color="#a4131c"/>
      <stop offset="100%" stop-color="#4d080c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- sunburst rays -->
  <g fill="#ffd75e" opacity=".07">
    <path d="M600 40 L120 630 L260 630 Z"/>
    <path d="M600 40 L380 630 L470 630 Z"/>
    <path d="M600 40 L600 630 L690 630 Z"/>
    <path d="M600 40 L820 630 L910 630 Z"/>
    <path d="M600 40 L1080 630 L1200 630 Z"/>
    <path d="M600 40 L0 520 L0 630 Z"/>
    <path d="M600 40 L1200 520 L1200 630 Z"/>
  </g>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="600" y="132" text-anchor="middle" fill="#ffd75e" font-family="Georgia, 'Times New Roman', serif"
        font-size="30" letter-spacing="7">★  PEOPLE’S PICTURES INTERACTIVE</text>

  <!-- textLength pins the width so the headline fits regardless of which font resolves -->
  <text x="600" y="268" text-anchor="middle" fill="#f6eed9"
        font-family="'Arial Narrow', Impact, 'Helvetica Neue', sans-serif" font-size="112"
        font-weight="bold" textLength="1040" lengthAdjust="spacingAndGlyphs">PARAMOUNT LEADER</text>

  <text x="600" y="342" text-anchor="middle" fill="#f9e9c8" font-family="Georgia, serif"
        font-size="40" font-style="italic">The Xi Jinping Career Simulator</text>

  <g font-family="Georgia, serif" font-size="26" fill="#f3d9a8" text-anchor="middle">
    <text x="600" y="416">Type any policy. 24 pre-screened citizens react.</text>
    <text x="600" y="456">Talk to the Politburo — out loud.</text>
  </g>

  <g transform="translate(0,516)">
    <rect x="330" y="0" width="540" height="66" rx="8" fill="#e8b923"/>
    <text x="600" y="45" text-anchor="middle" fill="#4d080c"
          font-family="'Arial Narrow', Impact, sans-serif" font-size="34"
          font-weight="bold" textLength="470" lengthAdjust="spacingAndGlyphs">OFFICIAL APPROVAL 98.9%</text>
  </g>

  <text x="600" y="614" text-anchor="middle" fill="#d9a97f" font-family="Georgia, serif"
        font-size="19">Satire · parody · unaffiliated with any government, party or person</text>
</svg>
